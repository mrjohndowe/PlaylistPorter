name: Build Windows installer and release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix"
        required: true
        default: "0.1.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Resolve release version
        shell: pwsh
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $version = $env:MANUAL_VERSION
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release version must use MAJOR.MINOR.PATCH, for example 1.0.0."
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Run tests
        run: python -m unittest -v

      - name: Create Windows icon
        shell: pwsh
        env:
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SPOTIFY_CLIENT_ID) -or $env:SPOTIFY_CLIENT_ID -notmatch '^[A-Za-z0-9]+$') {
            throw "Set the repository Actions variable SPOTIFY_CLIENT_ID before publishing an installer. Never use a Client Secret here."
          }
          "APP_VERSION = `"$env:APP_VERSION`"" | Set-Content -Encoding utf8 build_version.py
          "SPOTIFY_CLIENT_ID = `"$env:SPOTIFY_CLIENT_ID`"" | Set-Content -Encoding utf8 build_config.py
          python scripts/create_icon.py

      - name: Build standalone application
        run: python -m PyInstaller --noconfirm --clean PlaylistPorter.spec

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $compiler "/DAppVersion=$env:APP_VERSION" "installer\PlaylistPorter.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE." }

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $installer = "installer\output\Playlist-Porter-v$env:APP_VERSION-Setup.exe"
          $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $installer
          "$($hash.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($installer))" | Set-Content -Encoding ascii "$installer.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Playlist Porter ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            installer/output/Playlist-Porter-v${{ env.APP_VERSION }}-Setup.exe
            installer/output/Playlist-Porter-v${{ env.APP_VERSION }}-Setup.exe.sha256
